name: ci
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Lint presets
        run: bash tools/lint.sh
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Installer unit tests (stdlib unittest)
        run: python3 -m unittest discover -s tests -v
      - name: No GPL Qt in tree (MIT license guard)
        run: |
          ! grep -rni "pyqt" --include="*.py" --include="*.txt" --include="*.toml" --include="*.cfg" src setup.py tools || (echo "PyQt is GPL — use PySide6 (LGPL)" && exit 1)
      - name: Shell + desktop entry checks
        run: |
          bash -n setup.sh
          bash -n tools/gui_zenity.sh
          bash -n tools/lint.sh
          python3 -m py_compile setup.py src/zenfox_install/*.py
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate ZenFox-Setup.desktop
      - name: Installer smoke (fake profile round-trip)
        run: |
          FAKE=$(mktemp -d)/prof && mkdir -p "$FAKE" && echo old > "$FAKE/user.js" && echo old > "$FAKE/prefs.js"
          python3 setup.py --preset zenfox --profile "$FAKE" --yes
          test -f "$FAKE/user.js"
          BACKUP=$(ls -d "$FAKE"/zenfox-backup-* | head -n1)
          python3 setup.py --revert "$BACKUP"
          grep -q old "$FAKE/user.js"
  installer-qt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libs
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install PySide6
        run: python -m pip install --upgrade pip "PySide6>=6.8"
      - name: Qt GUI unit tests (offscreen)
        run: QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v
