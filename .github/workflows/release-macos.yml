name: release-macos-binary
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]
jobs:
  build-macos:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller + PySide6
        run: python -m pip install --upgrade pip pyinstaller "PySide6>=6.8"
      - name: Unit tests (incl. Qt offscreen)
        run: QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests
      - name: Build windowed binary (double-click GUI, no console)
        run: python tools/build_installer.py --windowed
      - name: Smoke test (CLI flags still parse)
        run: ./dist/ZenFox-Setup-macOS --list-profiles
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenFox-Setup-macOS
          path: dist/ZenFox-Setup-macOS
      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZenFox-Setup-macOS
