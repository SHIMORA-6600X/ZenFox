name: release-linux-binary
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libs
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install PyInstaller + PySide6
        run: python -m pip install --upgrade pip pyinstaller "PySide6>=6.8"
      - name: Unit tests (incl. Qt offscreen)
        run: QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests
      - name: Build binary (double-click GUI via setup.sh, console binary)
        run: python tools/build_installer.py
      - name: Smoke test (CLI flags still parse)
        run: ./dist/ZenFox-Setup-Linux --list-profiles
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenFox-Setup-Linux
          path: dist/ZenFox-Setup-Linux
      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZenFox-Setup-Linux
