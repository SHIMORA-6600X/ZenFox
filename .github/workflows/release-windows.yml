name: release-windows-exe
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]
jobs:
  build-exe:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller + PySide6
        run: python -m pip install --upgrade pip pyinstaller "PySide6>=6.8"
      - name: Unit tests (installer)
        run: python -m unittest discover -s tests
      - name: Build windowed exe (double-click GUI, no console)
        run: python tools/build_installer.py --windowed
      - name: Smoke test (CLI flags still parse)
        run: .\dist\ZenFox-Setup-Windows.exe --list-profiles
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenFox-Setup-Windows
          path: dist/ZenFox-Setup-Windows.exe
      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZenFox-Setup-Windows.exe
