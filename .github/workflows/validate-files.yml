# ============================================================
#  ZenFox File Validation Pipeline
#  - Validate user.js syntax (with detailed error output)
#  - Find all .zip files, extract them, validate JS inside
#  - Detect: empty files, BOM, CRLF, non-ASCII chars
#  - Show exact line numbers for syntax errors
#  - No automatic release creation
# ============================================================

name: Validate Files

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  #  JOB 1: Validate user.js
  # ============================================================
  validate-userjs:
    name: 🔍 Validate user.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check if user.js exists
        id: check
        run: |
          if [ -f "user.js" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate user.js syntax
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "## 🔍 user.js Syntax Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if node --check user.js 2>/tmp/userjs_error.txt; then
            echo "✅ \`user.js\` is valid" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ \`user.js\` has syntax errors:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/userjs_error.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Detect file issues (BOM, CRLF, non-ASCII)
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🧪 user.js File Issues" >> $GITHUB_STEP_SUMMARY
          issues=0

          # Check for BOM (Byte Order Mark)
          if head -c 3 user.js | grep -q $'\xEF\xBB\xBF'; then
            echo "⚠️ BOM detected at start of file" >> $GITHUB_STEP_SUMMARY
            issues=1
          fi

          # Check for CRLF line endings
          if grep -q $'\r' user.js 2>/dev/null; then
            echo "⚠️ CRLF line endings detected (Windows-style)" >> $GITHUB_STEP_SUMMARY
            issues=1
          fi

          # Check for trailing whitespace
          trailing=$(grep -n ' $' user.js 2>/dev/null | head -10)
          if [ -n "$trailing" ]; then
            echo "⚠️ Trailing whitespace found on lines:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$trailing" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            issues=1
          fi

          # Check for tab characters (mixed indentation)
          if grep -qP '\t' user.js 2>/dev/null; then
            echo "⚠️ Tab characters detected (mixed indentation)" >> $GITHUB_STEP_SUMMARY
            issues=1
          fi

          # Check for non-ASCII characters
          nonascii=$(grep -nP '[^\x00-\x7F]' user.js 2>/dev/null | head -10)
          if [ -n "$nonascii" ]; then
            echo "⚠️ Non-ASCII characters found on lines:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$nonascii" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            issues=1
          fi

          # Check for TODO/FIXME markers
          todos=$(grep -nE 'TODO|FIXME|XXX|HACK' user.js 2>/dev/null)
          if [ -n "$todos" ]; then
            echo "⚠️ TODO/FIXME markers found:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$todos" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ $issues -eq 0 ]; then
            echo "✅ No file issues detected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Report if missing
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "## ⚠️ user.js not found" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ No \`user.js\` file at root." >> $GITHUB_STEP_SUMMARY

  # ============================================================
  #  JOB 2: Validate all .zip files
  # ============================================================
  validate-zips:
    name: 📦 Validate ZIP Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find ZIP files
        id: find
        run: |
          # Search entire repository except .git
          zips=$(find . -name "*.zip" -not -path "./.git/*" | sort)
          if [ -z "$zips" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "$zips" > /tmp/zip_list.txt
            echo "📦 Found ZIP files:"
            cat /tmp/zip_list.txt
          fi

      - name: Skip if no ZIP
        if: steps.find.outputs.found == 'false'
        run: |
          echo "## 📦 ZIP Validation" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ No ZIP files found in repository." >> $GITHUB_STEP_SUMMARY

      - name: Validate each ZIP
        if: steps.find.outputs.found == 'true'
        run: |
          echo "## 📦 ZIP Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          failed=0
          while IFS= read -r zip; do
            echo "### 📁 Processing: \`$zip\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Create temp dir for extraction
            tmpdir=$(mktemp -d)

            # Test ZIP integrity first
            if ! unzip -t "$zip" > /dev/null 2>&1; then
              echo "❌ \`$zip\` is corrupted (failed integrity test)" >> $GITHUB_STEP_SUMMARY
              failed=1
              rm -rf "$tmpdir"
              continue
            fi

            # Extract
            if ! unzip -o "$zip" -d "$tmpdir" > /dev/null 2>&1; then
              echo "❌ Failed to extract \`$zip\`" >> $GITHUB_STEP_SUMMARY
              failed=1
              rm -rf "$tmpdir"
              continue
            fi

            # List contents
            echo "**Contents:**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            find "$tmpdir" -type f -printf '%P\n' | sort >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            # Check for empty files
            empty_found=0
            while IFS= read -r file; do
              if [ -f "$file" ] && [ ! -s "$file" ]; then
                echo "⚠️ Empty file inside ZIP: \`${file#$tmpdir/}\`" >> $GITHUB_STEP_SUMMARY
                empty_found=1
              fi
            done < <(find "$tmpdir" -type f)

            # Validate all .js files inside with detailed errors
            js_failed=0
            js_count=0
            while IFS= read -r jsfile; do
              js_count=$((js_count + 1))
              relpath="${jsfile#$tmpdir/}"
              if ! node --check "$jsfile" 2>/tmp/jserr.txt; then
                echo "❌ Syntax error in \`$relpath\`:" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                cat /tmp/jserr.txt >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                js_failed=1
              else
                echo "✅ \`$relpath\` — valid JS" >> $GITHUB_STEP_SUMMARY
              fi
            done < <(find "$tmpdir" -name "*.js" -type f)

            if [ $js_count -eq 0 ]; then
              echo "ℹ️ No .js files found inside this ZIP" >> $GITHUB_STEP_SUMMARY
            fi

            # Summary for this ZIP
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ $js_failed -eq 0 ] && [ $empty_found -eq 0 ]; then
              echo "✅ **\`$zip\` passed all checks**" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **\`$zip\` failed validation**" >> $GITHUB_STEP_SUMMARY
              failed=1
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            rm -rf "$tmpdir"
          done < /tmp/zip_list.txt

          echo "---" >> $GITHUB_STEP_SUMMARY
          if [ $failed -eq 0 ]; then
            echo "### ✅ All ZIP files passed validation." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Some ZIP files failed validation. See details above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # ============================================================
  #  JOB 3: Final Report
  # ============================================================
  report:
    name: 📊 Final Report
    runs-on: ubuntu-latest
    needs: [validate-userjs, validate-zips]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 🏁 Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| user.js | ${{ needs.validate-userjs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ZIP files | ${{ needs.validate-zips.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.validate-userjs.result }}" = "success" ] && \
             [ "${{ needs.validate-zips.result }}" = "success" ]; then
            echo "✅ **All checks passed. Ready for release.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some checks failed. Fix errors before releasing.**" >> $GITHUB_STEP_SUMMARY
          fi
