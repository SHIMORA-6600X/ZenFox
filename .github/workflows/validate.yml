# ============================================================
#  ZenFox Validation Pipeline
#  - Validate JavaScript syntax
#  - Validate JSON syntax
#  - Validate Python syntax (if present)
#  - Check for required files
#  - No build or release creation
# ============================================================

name: ZenFox Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  #  JOB 1: JavaScript Syntax Check
  # ============================================================
  validate-js:
    name: 🔍 Validate JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JS syntax
        run: |
          echo "## 🔍 JavaScript Syntax Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          failed=0
          for file in *.js; do
            [ -f "$file" ] || continue
            if node --check "$file" 2>/dev/null; then
              echo "✅ \`$file\` — OK" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ \`$file\` — Syntax error" >> $GITHUB_STEP_SUMMARY
              failed=1
            fi
          done
          exit $failed

      - name: Check for common mistakes
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ⚠️ Common Patterns" >> $GITHUB_STEP_SUMMARY
          if grep -rn "eval(" *.js 2>/dev/null; then
            echo "⚠️ Found eval()" >> $GITHUB_STEP_SUMMARY
          fi
          if grep -rn "document.write" *.js 2>/dev/null; then
            echo "⚠️ Found document.write" >> $GITHUB_STEP_SUMMARY
          fi
          echo "✅ Check complete" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  #  JOB 2: JSON Validation
  # ============================================================
  validate-json:
    name: 📋 Validate JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          echo "## 📋 JSON Files Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          failed=0
          found=0
          while IFS= read -r file; do
            found=1
            if python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "✅ \`$file\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ \`$file\` — Invalid JSON" >> $GITHUB_STEP_SUMMARY
              failed=1
            fi
          done < <(find . -name "*.json" -not -path "./.git/*" -not -path "./node_modules/*")
          if [ "$found" -eq 0 ]; then
            echo "ℹ️ No JSON files found" >> $GITHUB_STEP_SUMMARY
          fi
          exit $failed

  # ============================================================
  #  JOB 3: Python Syntax Check (if present)
  # ============================================================
  validate-python:
    name: 🐍 Validate Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: |
          echo "## 🐍 Python Syntax Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          py_files=$(find . -name "*.py" -not -path "./.git/*")
          if [ -z "$py_files" ]; then
            echo "ℹ️ No Python files found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          failed=0
          for file in $py_files; do
            if python3 -m py_compile "$file" 2>/dev/null; then
              echo "✅ \`$file\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ \`$file\` — Syntax error" >> $GITHUB_STEP_SUMMARY
              failed=1
            fi
          done
          exit $failed

  # ============================================================
  #  JOB 4: Repository Structure Check
  # ============================================================
  check-structure:
    name: 📁 Check Repository Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          echo "## 📁 Required Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          required=("README.md" "LICENSE" "CHANGELOG.md" "user.js")
          missing=0
          for f in "${required[@]}"; do
            if [ -f "$f" ]; then
              echo "✅ \`$f\` present" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ \`$f\` missing" >> $GITHUB_STEP_SUMMARY
              missing=1
            fi
          done

      - name: Check file sizes
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 File Sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh *.js *.md 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check for empty files
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📭 Empty Files" >> $GITHUB_STEP_SUMMARY
          empty=0
          for file in *.js *.md; do
            [ -f "$file" ] || continue
            if [ ! -s "$file" ]; then
              echo "⚠️ \`$file\` is empty" >> $GITHUB_STEP_SUMMARY
              empty=1
            fi
          done
          if [ "$empty" -eq 0 ]; then
            echo "✅ No empty files" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================
  #  JOB 5: Final Report
  # ============================================================
  report:
    name: 📊 Final Report
    runs-on: ubuntu-latest
    needs: [validate-js, validate-json, validate-python, check-structure]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 🏁 Final Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript | ${{ needs.validate-js.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| JSON | ${{ needs.validate-json.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | ${{ needs.validate-python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Structure | ${{ needs.check-structure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.validate-js.result }}" = "success" ] && \
             [ "${{ needs.validate-json.result }}" = "success" ] && \
             [ "${{ needs.validate-python.result }}" = "success" ] && \
             [ "${{ needs.check-structure.result }}" = "success" ]; then
            echo "✅ **All checks passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some checks failed — see details above**" >> $GITHUB_STEP_SUMMARY
          fi
